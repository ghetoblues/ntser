productName: NTSer
appId: "org.observepeople.ntser"

# Seals the bundle with an ad-hoc signature once electron-builder has skipped
# signing; see the script for why an unsealed bundle is worse than an unsigned
# one. Also drops unused Chromium locales and SwiftShader before that seal.
afterPack: scripts/adhoc-sign.mjs

# A universal binary is two copies of Chromium glued together. Ship one chip
# per disk image instead; CI builds both, `make app` builds this machine.
directories:
  app: dist
  output: bundle

# No native modules: the main process is one esbuild bundle. Skip a rebuild
# pass, and do not pack a production node_modules if one sneaks into dist.
asar: true
npmRebuild: false

mac:
  # Signing needs a paid Developer ID. Without one, electron-builder would reach
  # for whatever certificate happens to be in the keychain - a Development one
  # signs nothing anyone else can run, and fails outright when Apple's timestamp
  # service is unreachable. Ship it unsigned and say so in the README.
  identity: null
  icon: app/icon.icns
  category: public.app-category.music
  electronLanguages:
    - en
  target:
    - dir
    - dmg

fileAssociations:
  ext: webloc
  role: Viewer
